name: Azure IaC validation

on:
  pull_request:
    paths:
      - "deploy/azure/**"
      - ".github/workflows/azure-iac.yml"
  push:
    branches: [main]
    paths:
      - "deploy/azure/**"
      - ".github/workflows/azure-iac.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-azd@v2
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build Bicep
        run: az bicep build --file deploy/azure/main.bicep
