[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-personal-algorithm"
version = "0.1.0"
description = "A local-first, user-owned recommendation engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/personal_algorithm"]
