name: Requirements contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  requirements:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: pH34r-pH/long-haul
          ref: 00603e72217a5e792e91a405454ac74e23a3b3a4
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
        with:
          version: v0.17.0
      - name: Validate declaration and native-source fingerprints
        run: python3 tooling/tools/requirements.py --root source --output "$RUNNER_TEMP/requirements.json"
