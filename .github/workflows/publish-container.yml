name: Publish container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit image
        env:
          IMAGE: ghcr.io/ph34r-ph/the-personal-algorithm
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull -t "$IMAGE:sha-$SHA" .
          docker push "$IMAGE:sha-$SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:sha-$SHA")
          test -n "$digest"
          echo "Published immutable image: $digest" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$digest" > container-image.txt
          jq -n --arg image "$digest" --arg sha "$SHA" '{schemaVersion:1,image:$image,sourceSha:$sha,repository:"pH34r-pH/the-personal-algorithm"}' > container-image.json
      - name: Retain image receipt
        uses: actions/upload-artifact@v4
        with:
          name: personal-algorithm-container-${{ github.run_id }}
          path: |
            container-image.txt
            container-image.json
          retention-days: 30
